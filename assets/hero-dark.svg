<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Hix-001 profile hero</title>
  <style>
    .bg { fill: #0a0d13; stroke: #1d2129; stroke-width: 1; }
    .ink { fill: #dfe4eb; }
    .muted { fill: #8b9099; }
    .tan { fill: #9aa1ac; }
    .sub-tan { fill: #6d7480; }
    .dot { fill: #e87252; }
    .serif { font-family: "Charter", "Iowan Old Style", "Times New Roman", Georgia, serif; }
    .mono { font-family: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace; }
    .rule { stroke: #dfe4eb; stroke-width: 1; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1199" height="359" rx="6"/>

  <!-- Top rule -->
  <text class="mono ink" x="48" y="56" font-size="11" letter-spacing="3" text-transform="uppercase">Date : 07 • 09 • 2026</text>
  <circle class="dot" cx="840" cy="51.5" r="3.5"/>
  <text class="mono ink" x="852" y="56" font-size="11" letter-spacing="3">SHIPPING DAILY</text>
  <text class="mono ink" x="1152" y="56" font-size="11" letter-spacing="3" text-anchor="end">DELHI</text>
  <line class="rule" x1="48" y1="70" x2="1152" y2="70"/>

  <!-- Left column: byline, name, abstract -->
  <text class="mono muted" x="48" y="112" font-size="11" letter-spacing="2.5">STUDENT   ·   SOFTWARE DEVELOPER</text>
  <text class="serif ink" x="48" y="184" font-size="64" font-weight="500" letter-spacing="-0.8">Harsh Jha</text>

  <!-- Cool Developer Emblem Badge stamped next to the name -->
  <g transform="translate(313,138) scale(0.52) rotate(-3 50 50)">
    <rect x="8" y="8" width="84" height="84" rx="20" fill="#c8473a"/>
    <rect x="16" y="16" width="68" height="68" rx="12" fill="none" stroke="#14110e" stroke-opacity="0.5" stroke-width="2.5"/>
    <!-- Code prompt emblem: > _ -->
    <path d="M32 36 L44 48 L32 60 M52 60 L68 60" stroke="#14110e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text class="mono tan" x="48" y="224" font-size="11" letter-spacing="2.5">ABSTRACT</text>

  <!-- Abstract body, two lines -->
  <text class="serif ink" x="48" y="254" font-size="16" font-style="italic">
    <tspan x="48" dy="0">Building software and shipping open source projects.</tspan>
    <tspan x="48" dy="22">Focused on modern software engineering and developer tooling.</tspan>
  </text>

  <!-- Right column: stats -->
  <line class="rule" x1="780" y1="100" x2="780" y2="300"/>

  <text class="mono ink" x="966" y="128" font-size="11" letter-spacing="2.5" opacity="0.7" text-anchor="middle">DAY STREAK</text>
  <text x="966" y="192" text-anchor="middle">
    <tspan class="serif ink" font-size="54" font-weight="500" letter-spacing="-1.2">43</tspan><tspan class="mono muted" font-size="14" dy="-20" dx="4">d</tspan>
  </text>
  <text class="mono sub-tan" x="966" y="214" font-size="11" text-anchor="middle">current</text>
</svg>
